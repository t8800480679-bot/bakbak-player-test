<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer"
        content="strict-origin-when-cross-origin">
  <title>BakBak YouTube Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #08090D;
      color: white;
      font-family: Arial, sans-serif;
    }
    h2 { color: #FF2D75; }
    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h2>😂 BakBak Player Test</h2>
  <p>Testing YouTube playback on HTTPS.</p>

  <iframe
    src="https://www.youtube.com/embed/M7lc1UVf-VE?playsinline=1"
    title="YouTube player"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
